<script>
const bg=document.getElementById('bg');
const ids=['name','age','date','time'];
document.getElementById('clear').onclick=()=>ids.forEach(id=>document.getElementById(id).value='');

async function renderInvite(){
  const c=document.createElement('canvas');
  c.width=bg.naturalWidth; c.height=bg.naturalHeight;
  const ctx=c.getContext('2d');
  ctx.drawImage(bg,0,0,c.width,c.height);
  ctx.fillStyle='#7d39c7';
  ctx.textBaseline='middle';
  const map={
    name:[205,895,720,70],
    age:[205,1052,720,70],
    date:[205,1206,300,70],
    time:[605,1206,320,70]
  };
  for(const id of ids){
    const value=document.getElementById(id).value.trim();
    if(!value) continue;
    const [x,y,w,h]=map[id];
    let fs=34;
    while(fs>18){
      ctx.font=`700 ${fs}px Arial`;
      if(ctx.measureText(value).width<=w-20) break;
      fs-=2;
    }
    ctx.fillText(value,x+8,y+h/2);
  }
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.95));
}

document.getElementById('share').onclick=async()=>{
  const blob=await renderInvite();
  const file=new File([blob],'UNTZ_UNTZ_invitation.jpg',{type:'image/jpeg'});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'UNTZ UNTZ Invitation'});return;}catch(e){}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='UNTZ_UNTZ_invitation.jpg';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
</script>
